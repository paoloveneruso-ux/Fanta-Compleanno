<style>
:root{
  --bg:#0a1626; --card:#122238; --card2:#1a3050; --line:#28446a;
  --text:#f2f7ff; --muted:#9db3cf; --gold:#dcf03a; --ball:#dcf03a; --court:#2f6fc0;
  --ok:#39d0b3; --warn:#ffc857; --err:#ff6b81;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--gold)}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
h2{font-size:1.15rem} h3{font-size:1rem}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg) 70%,transparent);
  padding:calc(12px + env(safe-area-inset-top)) 0 10px}
header.top .wrap{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:1.2rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo span{color:var(--ball)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line);font-size:.85rem;color:var(--text);cursor:pointer;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:.85rem} .center{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;
  padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#e8f84a,#b9de22);border:none;color:#0a1626}
.btn.gold{background:var(--ball);color:#0a1626;border:none}
.btn.danger{background:transparent;border-color:var(--err);color:var(--err)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:#0d1c30;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ball)}
input[type=color]{padding:2px;height:42px;width:56px;flex:none}
input[type=checkbox]{width:auto}
label.f{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 4px}
textarea{min-height:70px;resize:vertical}
.pts{font-weight:800;color:var(--gold);white-space:nowrap}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:rgba(57,208,179,.15);border-color:var(--ok);color:var(--ok)}
.badge.warn{background:rgba(255,200,87,.12);border-color:var(--warn);color:var(--warn)}
.badge.err{background:rgba(255,107,129,.12);border-color:var(--err);color:var(--err)}
.badge.hid{color:var(--muted)}
.obj{display:flex;gap:12px}
.obj .body{flex:1;min-width:0}
.obj.done{border-color:rgba(57,208,179,.5)}
.thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;background:#081320;flex:none;cursor:pointer;border:1px solid var(--line)}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.hero{background:linear-gradient(135deg,rgba(47,111,192,.45),rgba(220,240,58,.12));border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
.hero .big{font-size:2rem;font-weight:800;color:var(--gold);line-height:1}
.rank{display:flex;align-items:center;gap:12px}
.rank .pos{font-size:1.4rem;width:36px;text-align:center;font-weight:800}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.list{margin:10px 0 0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:.9rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,22,38,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px}
nav.tabs button{position:relative;flex:1;max-width:140px;min-width:0;background:none;border:none;color:var(--muted);font:inherit;font-size:.78rem;font-weight:600;
  padding:6px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:1.35rem}
nav.tabs button.on{color:var(--text);background:var(--card2)}
nav.tabs .nb{position:absolute;top:2px;right:calc(50% - 22px);background:var(--err);color:#fff;font-size:.65rem;font-weight:800;border-radius:99px;padding:1px 6px}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.subtabs button.on{background:var(--court);border-color:var(--court);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase}
td.n,th.n{text-align:right}
.bar{height:10px;border-radius:99px;background:#0d1c30;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--err))}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-150%);
  z-index:50;background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;transition:transform .25s;max-width:92vw;font-weight:600}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--ok)} #toast.err{border-color:var(--err)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(3,8,16,.78);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
#modal img.view,#modal video.view{width:100%;max-height:65vh;object-fit:contain;border-radius:12px;background:#000}
.prog{height:12px;border-radius:99px;background:#0d1c30;overflow:hidden;margin:12px 0}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8f84a,#b9de22);transition:width .2s}
.member{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.member .nm{flex:1;min-width:110px;font-weight:600}
.member select{width:auto;max-width:150px;padding:6px 8px;font-size:.85rem}
.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* ------------------------------------------------ INVITO */
.invite{position:relative;overflow:hidden;isolation:isolate;border-radius:26px;text-align:center;
  padding:34px 20px 150px;margin:0 0 16px;border:1px solid #2b4f7d;
  background:radial-gradient(130% 75% at 50% 0%,#24508a 0%,#10294a 50%,#081424 100%);
  box-shadow:0 20px 60px rgba(0,0,0,.45)}
.invite .court{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;z-index:-1}
.invite .rackets{position:absolute;left:50%;top:40px;width:300px;transform:translateX(-50%);opacity:.13;z-index:-1}
.snow{position:absolute;inset:0;pointer-events:none;z-index:1}
.snow i{position:absolute;top:-6%;color:#fff;font-style:normal;line-height:1;animation:fall linear infinite;text-shadow:0 0 6px rgba(255,255,255,.6)}
@keyframes fall{0%{top:-6%;transform:translateX(0) rotate(0)}50%{transform:translateX(var(--dx)) rotate(180deg)}100%{top:104%;transform:translateX(0) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.snow i{animation:none;display:none}}
.inv-kicker{position:relative;z-index:2;font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;color:#cfe0f5;font-weight:700}
.inv-num{position:relative;z-index:2;font-family:Anton,Impact,"Arial Narrow",sans-serif;font-size:132px;line-height:1;margin:8px 0 2px;
  color:#fff;display:flex;align-items:center;justify-content:center;gap:2px;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.inv-num svg{width:.92em;height:.92em;margin-top:-.04em;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.inv-of{position:relative;z-index:2;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:#cfe0f5}
.inv-name{position:relative;z-index:2;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;font-size:3rem;
  line-height:1.05;margin:4px 0 14px;color:var(--ball);text-shadow:0 4px 18px rgba(0,0,0,.35);overflow-wrap:anywhere}
.inv-date{position:relative;z-index:2;display:inline-block;background:rgba(255,255,255,.95);color:#0a1626;font-weight:800;
  padding:9px 18px;border-radius:999px;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.inv-count{position:relative;z-index:2;margin-top:12px;color:#e3eefb;font-weight:600;font-size:.92rem}
.inv-details{position:relative;z-index:2;margin:16px auto 0;max-width:440px;background:rgba(8,20,36,.55);border:1px solid rgba(255,255,255,.18);
  border-radius:14px;padding:12px 14px;color:#eaf2fc;white-space:pre-wrap;font-size:.95rem;backdrop-filter:blur(4px)}
.invite.compact{padding:20px 16px 150px}
.invite.has-video{background:#0b1a2e;padding:26px 20px 22px;display:flex;flex-direction:column;align-items:center;min-height:min(84vh,760px)}
.invite.has-video.compact{min-height:0;padding:18px 16px 20px}
.inv-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.inv-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,16,30,.78) 0%,rgba(6,16,30,.25) 42%,rgba(6,16,30,.2) 58%,rgba(6,16,30,.85) 100%)}
.invite.compact .inv-shade{background:rgba(6,16,30,.6)}
.inv-spacer{flex:1;min-height:110px}
.inv-btn{position:absolute;z-index:3;border:1px solid rgba(255,255,255,.35);background:rgba(6,16,30,.55);color:#fff;border-radius:999px;cursor:pointer;backdrop-filter:blur(4px)}
.inv-sound{top:12px;right:12px;width:40px;height:40px;font-size:1.1rem}
.inv-play{top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;font-size:1.8rem}
.inv-play[hidden]{display:none}
.invite.compact .inv-num{font-size:84px}
.invite.compact .inv-name{font-size:2rem;margin-bottom:10px}
.invite.compact .rackets{width:200px;top:16px}

/* ------------------------------------------------ BUSTA (prima apertura) */
.env-wrap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(120% 80% at 50% 10%,#24508a 0%,#10294a 50%,#081424 100%);cursor:pointer;
  transition:opacity .7s ease,transform .7s ease;-webkit-user-select:none;user-select:none;padding:20px}
.env-wrap.gone{opacity:0;transform:scale(1.06);pointer-events:none}
.env-head{position:relative;z-index:2;color:#cfe0f5;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;font-weight:700;text-align:center}
.env{position:relative;z-index:2;width:min(84vw,340px);aspect-ratio:3/2;perspective:1200px;filter:drop-shadow(0 22px 40px rgba(0,0,0,.5));
  animation:envFloat 3.2s ease-in-out infinite}
@keyframes envFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.env-back{position:absolute;inset:0;background:#e3dccd;border-radius:12px}
.env-letter{position:absolute;left:6%;right:6%;top:7%;height:88%;z-index:1;background:#fffdf7;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#0a1626;
  transition:transform 1s cubic-bezier(.2,.8,.2,1) .5s;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.env-letter .lk{font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;font-weight:700;color:#2f6fc0}
.env-letter .ln{font-family:Anton,Impact,sans-serif;font-size:3.4rem;line-height:1;margin:2px 0}
.env-letter .lname{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;font-size:1.6rem;color:#7a9a00}
.env-front{position:absolute;inset:0;z-index:2;border-radius:12px;background:linear-gradient(160deg,#f7f2e7,#ebe3d2);
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:3;background:linear-gradient(180deg,#efe7d6,#e2d8c3);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .7s ease .15s,z-index 0s .5s;border-radius:12px 12px 0 0}
.env-seal{position:absolute;left:50%;top:60%;width:70px;height:70px;z-index:4;transform:translate(-50%,-50%);transition:transform .4s ease,opacity .4s ease}
.env-seal svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.env-to{position:relative;z-index:2;text-align:center;color:#fff;font-size:1.05rem}
.env-to b{display:block;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:2rem;color:var(--ball);margin-top:2px}
.env-tap{position:relative;z-index:2;color:#fff;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
  padding:10px 20px;border-radius:999px;animation:envPulse 1.6s ease-in-out infinite}
@keyframes envPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.env-wrap.open .env{animation:none}
.env-wrap.open .env-seal{transform:translate(-50%,-50%) scale(1.5);opacity:0}
.env-wrap.open .env-flap{transform:rotateX(180deg);z-index:0}
.env-wrap.open .env-letter{transform:translateY(-58%)}
.env-wrap.open .env-tap{opacity:0;animation:none}
@media (prefers-reduced-motion:reduce){.env,.env-tap{animation:none}.env-letter,.env-flap,.env-seal{transition:none}}

/* ------------------------------------------------ RSVP / INTOLLERANZE */
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rsvp button{appearance:none;border:2px solid var(--line);background:#0d1c30;color:var(--text);border-radius:14px;padding:12px 4px;
  font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.rsvp.two{grid-template-columns:1fr 1fr}
.rsvp button .e{font-size:1.6rem}
.rsvp button.on.si{border-color:var(--ok);background:rgba(57,208,179,.14)}
.rsvp button.on.forse{border-color:var(--warn);background:rgba(255,200,87,.12)}
.rsvp button.on.no{border-color:var(--err);background:rgba(255,107,129,.12)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tags button{appearance:none;border:1px solid var(--line);background:#0d1c30;color:var(--text);border-radius:999px;padding:8px 13px;font:inherit;font-size:.9rem;cursor:pointer}
.tags button.on{background:var(--ball);border-color:var(--ball);color:#0a1626;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:1.5rem}
.stats span{font-size:.72rem;color:var(--muted)}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ------------------------------------------------ NOTIZIE */
.news .body{white-space:pre-wrap;margin-top:6px;overflow-wrap:anywhere}
.news img.att{display:block;width:100%;max-height:420px;object-fit:contain;background:#081320;border-radius:12px;margin-top:10px;cursor:pointer;border:1px solid var(--line)}
.news.pinned{border-color:var(--ball)}
</style>
</head>

  pendingRender: false, busy: false, fatal: null
};

/* ---------------------------------------------------------- utilità */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => new Date(d).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'x';

/* ---------------------------------------------------------- avvio e dati */
async function init() {
  if (!configured) { S.fatal = 'config'; return render(true); }
  try {
    let { data: { session } } = await sb.auth.getSession();
    if (!session) {
      const { data, error } = await sb.auth.signInAnonymously();
      if (error) throw error;
      session = data.session;
    }
    S.uid = session.user.id;
    await loadAll();
    subscribeRealtime();
  } catch (e) {
    console.error(e);
    S.fatal = errMsg(e);
  }
  render(true);
}

async function loadAll() {
  const res = await Promise.all([
    sb.from('settings').select('*').eq('id', 1).maybeSingle(),
    sb.from('teams').select('*').order('created_at'),
    sb.from('participants').select('*').order('name'),
    sb.from('objectives').select('*').order('sort').order('created_at'),
    sb.from('submissions').select('*').order('created_at', { ascending: false }),
    sb.from('adjustments').select('*').order('created_at', { ascending: false }),
    sb.from('participant_devices').select('*').eq('user_id', S.uid).maybeSingle(),
    sb.rpc('is_admin'),
    sb.rpc('device_counts'),
    sb.from('news').select('*').order('pinned', { ascending: false }).order('created_at', { ascending: false }),
    sb.from('guest_info').select('*'),
    sb.rpc('carpool')
  ]);
  const bad = res.find(r => r.error);
  if (bad) {
    const m = errMsg(bad.error);
    if (/does not exist|schema cache|Could not find/i.test(m)) throw new Error('Database da aggiornare: esegui (di nuovo) tutto setup.sql nel SQL Editor di Supabase.');
    throw bad.error;
  }
  const [st, tm, pa, ob, su, ad, md, adm, dc, nw, gi, cp] = res.map(r => r.data);
  S.carpool = cp || [];
  S.settings = Object.assign({}, S.settings, st || {});
  S.teams = tm || []; S.participants = pa || []; S.objectives = ob || [];
  S.submissions = su || []; S.adjustments = ad || []; S.news = nw || [];
  S.guests = gi || [];   // RLS: l'admin le vede tutte, gli altri solo la propria
  S.me = md ? partById(md.participant_id) || null : null;
  S.myGuest = S.me ? guestOf(S.me.id) || null : null;
  S.isAdmin = !!adm;
  S.deviceCounts = {}; (dc || []).forEach(r => S.deviceCounts[r.participant_id] = Number(r.n));
  if (S.isAdmin) {
    const { data } = await sb.from('participant_devices').select('*').order('created_at');
    S.devices = data || [];
  }
  if (!S.isAdmin && S.tab === 'admin') S.tab = 'notizie';
  document.title = `Festa di compleanno di ${S.settings.invite_name || 'Vincenzo'} 🎾`;
}

async function reload() {
  try { await loadAll(); } catch (e) { toast(errMsg(e), 'err'); }
  render(true);
}

let rlT;
function subscribeRealtime() {
  sb.channel('fanta-db')
    .on('postgres_changes', { event: '*', schema: 'public' }, () => {
      clearTimeout(rlT);
      rlT = setTimeout(async () => { try { await loadAll(); render(false); } catch (e) { } }, 700);
    })
    .subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reloadQuiet(); });
}
async function reloadQuiet() { try { await loadAll(); render(false); } catch (e) { } }

/* ---------------------------------------------------------- punteggi */
function adjSum(tid) { return S.adjustments.filter(a => a.team_id === tid).reduce((s, a) => s + a.points, 0); }
function teamObjPts(tid) { return validSubs().filter(s => s.team_id === tid).reduce((s, x) => s + (x.points || 0), 0); }
function teamScore(tid) { return teamObjPts(tid) + adjSum(tid); }
function partScore(pid) { return validSubs().filter(s => s.participant_id === pid).reduce((s, x) => s + (x.points || 0), 0); }
function partCount(pid) { return validSubs().filter(s => s.participant_id === pid).length; }
function standings() {
  const rows = S.teams.map(t => ({ t, pts: teamScore(t.id), obj: teamObjPts(t.id), bonus: adjSum(t.id), done: validSubs().filter(s => s.team_id === t.id).length }))
    .sort((a, b) => b.pts - a.pts || b.done - a.done || a.t.name.localeCompare(b.t.name));
  rows.forEach((r, i) => r.pos = i > 0 && r.pts === rows[i - 1].pts ? rows[i - 1].pos : i + 1);
  return rows;
}
const medal = p => p === 1 ? '🥇' : p === 2 ? '🥈' : p === 3 ? '🥉' : p;
const objsForTeam = tid => S.objectives.filter(o => o.active && (!o.team_id || o.team_id === tid));

/* ---------------------------------------------------------- flusso: invito → risposta → intolleranze → app */
function stage() {
  if (S.editRsvp) return 'invite';
  if (S.isAdmin && (!S.me || S.tab === 'admin')) return 'main';
  if (!S.me) return 'invite';
  const g = S.myGuest;
  if (!g || !g.rsvp) return 'invite';
  if (g.rsvp === 'no') return 'declined';
  if (!g.details_done || S.editIntol) return 'intol';
  return 'main';
}

/* ---------------------------------------------------------- render */
function render(force = true) {
  if (!force && (isTyping() || S.busy || $('#modal').classList.contains('show'))) { S.pendingRender = true; return; }
  S.pendingRender = false;
  const app = $('#app');
  if (S.fatal) { app.innerHTML = viewFatal(); return; }
  const st = stage();
  app.innerHTML = st === 'invite' ? viewInvite() : st === 'declined' ? viewDeclined() : st === 'intol' ? viewIntol() : viewMain();
  restoreDrafts();
  hydrateThumbs();
  hookInviteVideo();
  maybeShowEnvelope();
}

function viewFatal() {
  if (S.fatal === 'config') return `<div class="wrap" style="padding-top:40px"><div class="card">

}

async function submitInvite() {
  const rsvp = S.drafts.rsvp || (S.myGuest && S.myGuest.rsvp);
  if (!rsvp) return toast('Scegli se ci sarai 🙂');
  const wasEditing = S.editRsvp && S.myGuest && S.myGuest.details_done;
  let error;
  if (S.me) {
    ({ error } = await sb.rpc('set_rsvp', { p_rsvp: rsvp }));
  } else {
    const first = ($('#inv-first').value || '').trim(), last = ($('#inv-last').value || '').trim();
    if (!first || !last) return toast('Inserisci nome e cognome', 'err');
    const existing = S.participants.find(p => normName(p.name) === normName(first + ' ' + last));
    if (existing && (S.deviceCounts[existing.id] || 0) > 0 &&
      !confirm(`«${existing.name}» risulta già registrato su un altro telefono.\nSei proprio tu? (Va bene se hai cambiato telefono.)`)) return;
    ({ error } = await sb.rpc('register_guest', { p_first: first, p_last: last, p_rsvp: rsvp, p_label: deviceLabel() }));
  }
  if (error) return toast(errMsg(error), 'err');
  clearDrafts('rsvp', 'inv-first', 'inv-last');
  S.editRsvp = false;
  S.editIntol = !!wasEditing && rsvp !== 'no';   // chi modifica la risposta rivede anche le intolleranze
  S.det = null;
  await reload();
  if (rsvp === 'no') toast('Risposta salvata');
  else toast(rsvp === 'si' ? 'Evvai! 🎉' : 'Ok, ti aspettiamo 🤞', 'ok');
}

/* ---------- 1b. non ci sarà */
function viewDeclined() {
  return `<div class="wrap" style="padding-top:calc(16px + env(safe-area-inset-top))">

/* ---------- 2. dettagli: intolleranze, accompagnatore, auto */
function viewIntol() {
  const g = S.myGuest || {};
  if (!S.det) S.det = {
    tags: (g.diet_tags && g.diet_tags.length) ? [...g.diet_tags] : [],
    plus: !!g.plus_one, car: g.car || '', seats: g.car_seats ?? 3, ride: g.ride_with || ''
  };
  const d = S.det;
  const tags = DIET_TAGS.map(t => `<button type="button" class="${d.tags.includes(t) ? 'on' : ''}" onclick="toggleTag(${esc(JSON.stringify(t))})">${esc(t)}</button>`).join('');
  const seg = (field, val, emoji, label) => `<button type="button" class="${d[field] === val ? 'on si' : ''}" onclick="S.det.${field}=${esc(JSON.stringify(val))};render()"><span class="e">${emoji}</span>${label}</button>`;
  // chi ha l'auto (con posti liberi) e gli altri invitati, per "vado con…"
  const others = S.carpool.filter(c => !S.me || c.participant_id !== S.me.id);
  const drivers = others.filter(c => c.car === 'si');
  const rest = S.participants.filter(p => (!S.me || p.id !== S.me.id) && !drivers.some(c => c.participant_id === p.id));
  const opt = (id, label) => `<option value="${id}" ${d.ride === id ? 'selected' : ''}>${esc(label)}</option>`;
  const rideSelect = `<select onchange="S.det.ride=this.value">
      <option value="">— Devo ancora organizzarmi —</option>
      ${drivers.length ? `<optgroup label="Hanno l'auto">${drivers.map(c => opt(c.participant_id, `${c.name} · ${freeSeats(c)} posti liberi`)).join('')}</optgroup>` : ''}
      ${rest.length ? `<optgroup label="Altri invitati">${rest.map(p => opt(p.id, p.name)).join('')}</optgroup>` : ''}
    </select>`;
  const myPassengers = S.me ? S.carpool.filter(c => c.ride_with === S.me.id) : [];
  return `<div class="wrap" style="padding-top:calc(24px + env(safe-area-inset-top))">
    <div class="muted small" style="margin-bottom:8px">${g.rsvp === 'forse' ? '🤔 Hai risposto forse' : '✅ Ci sarai!'} · ultimi dettagli</div>
    <div class="card"><h2>🍽️ Intolleranze, allergie o esigenze alimentari?</h2>
      <p class="muted small" style="margin:0">Seleziona tutto quello che ti riguarda. Lo vede solo l'organizzazione.</p>
      <div class="tags">${tags}</div>
      <label class="f">Altro o dettagli (es. allergia grave)</label>
      <textarea data-draft="intol-text" id="intol-text" placeholder="Facoltativo">${esc(g.intolerances || '')}</textarea></div>
    <div class="card"><h2>👫 Accompagnatore (+1)</h2>
      <div class="rsvp two">${seg('plus', false, '🙋', 'Vengo da solo')}${seg('plus', true, '👫', 'Porto un +1')}</div>
      ${d.plus ? `<label class="f">Nome e cognome dell'accompagnatore</label><input data-draft="plus-name" id="plus-name" value="${esc(g.plus_one_name || '')}" autocapitalize="words">
        <label class="f">Intolleranze dell'accompagnatore (se ce ne sono)</label><input data-draft="plus-notes" id="plus-notes" value="${esc(g.plus_one_notes || '')}" placeholder="Facoltativo">` : ''}</div>
    <div class="card"><h2>🚗 Come arrivi?</h2>
      <div class="rsvp two">${seg('car', 'si', '🚗', 'Ho l\'auto')}${seg('car', 'no', '🙋', 'Non ho l\'auto')}</div>
      ${d.car === 'si' ? `<label class="f">Posti liberi per altri invitati (escluso te${d.plus ? ' e il tuo +1' : ''})</label>
        <div class="row"><button class="btn" onclick="S.det.seats=Math.max(0,S.det.seats-1);render()">−</button>
        <b style="font-size:1.4rem;min-width:40px;text-align:center">${d.seats}</b>
        <button class="btn" onclick="S.det.seats=Math.min(8,S.det.seats+1);render()">+</button></div>
        <p class="small" style="margin:10px 0 0">${myPassengers.length ? `Vengono con te: <b>${myPassengers.map(c => esc(c.name)).join(', ')}</b>. ` : ''}Chi viaggia con te lo indichi dopo, dalla tab 🚗 Passaggi.</p>` : ''}
      ${d.car === 'no' ? `<label class="f">Ti sei già organizzato con qualcuno?</label>${rideSelect}` : ''}
      <p class="muted small" style="margin:10px 0 0">Auto e accompagnatore puoi aggiornarli quando vuoi dal menu in alto.</p></div>
    <button class="btn primary block" onclick="saveIntol()">${S.editIntol ? 'Salva' : 'Salva e continua'}</button>
    <button class="btn ghost block" style="margin:8px 0 30px" onclick="${S.editIntol && g.details_done ? 'S.editIntol=false;S.det=null;render()' : 'S.editRsvp=true;render()'}">${S.editIntol && g.details_done ? 'Annulla' : '← Cambia risposta all\'invito'}</button>
  </div>`;
}
function toggleTag(t) {
  const set = new Set(S.det.tags);
  if (set.has(t)) set.delete(t);
  else { if (t === 'Nessuna') set.clear(); else set.delete('Nessuna'); set.add(t); }
  S.det.tags = DIET_TAGS.filter(x => set.has(x));
  render();
}
async function saveIntol() {
  const d = S.det, text = ($('#intol-text').value || '').trim();
  if (!d.tags.length && !text) return toast('Intolleranze: seleziona almeno una voce (anche "Nessuna")');
  const plusName = d.plus ? ($('#plus-name').value || '').trim() : '';
  if (d.plus && !plusName) return toast('Scrivi il nome del tuo accompagnatore');
  if (!d.car) return toast('Indica se hai l\'auto');
  const { error } = await sb.rpc('save_details', {
    p_tags: d.tags, p_text: text, p_plus: d.plus, p_plus_name: plusName,
    p_plus_notes: d.plus ? ($('#plus-notes').value || '').trim() : '',
    p_car: d.car, p_seats: d.car === 'si' ? d.seats : null, p_ride: d.car === 'no' && d.ride ? d.ride : null
  });
  if (error) return toast(errMsg(error), 'err');
  clearDrafts('intol-text', 'plus-name', 'plus-notes');
  const first = !S.editIntol;
  S.editIntol = false; S.det = null; if (first) S.tab = 'notizie';
  await reload();
  toast(first ? 'Fatto! Benvenuto 🎾' : 'Salvato', 'ok');
}

/* ---------- passaggi */
function usedSeats(c) {
  return S.carpool.filter(x => x.ride_with === c.participant_id).reduce((n, x) => n + 1 + (x.plus_one ? 1 : 0), 0) + (c.car_others || []).length;
}
function freeSeats(c) { return Math.max(0, (c.car_seats || 0) - usedSeats(c)); }
function carCrew(c) {   // chi c'è in un'auto, autista compreso
  const crew = [`<b>${esc(c.name)}</b> <span class="muted small">(guida)</span>`];
  if (c.plus_one) crew.push(`${esc(c.plus_one_name || '+1')} <span class="muted small">(+1 di ${esc(c.name.split(' ')[0])})</span>`);
  S.carpool.filter(x => x.ride_with === c.participant_id).forEach(x => {
    crew.push(esc(x.name));
    if (x.plus_one) crew.push(`${esc(x.plus_one_name || '+1')} <span class="muted small">(+1 di ${esc(x.name.split(' ')[0])})</span>`);
  });
  (c.car_others || []).forEach(o => crew.push(`${esc(o)} <span class="muted small">(non in app)</span>`));
  return crew;
}
function myCarEditor(mine) {
  const pas = S.carpool.filter(x => x.ride_with === mine.participant_id);
  const others = mine.car_others || [];
  const used = usedSeats(mine), tot = mine.car_seats || 0;
  const cand = S.participants.filter(p => p.id !== mine.participant_id && !pas.some(x => x.participant_id === p.id))
    .map(p => {
      const c = S.carpool.find(x => x.participant_id === p.id);
      const note = !c ? ' · non ha risposto' : c.car === 'si' ? ' · ha l\'auto' : c.ride_with ? ` · va con ${(partById(c.ride_with)?.name || '?').split(' ')[0]}` : '';
      return `<option value="${p.id}">${esc(p.name)}${c && c.plus_one ? ' (+1)' : ''}${esc(note)}</option>`;
    }).join('');
  return `<div class="card" style="border-color:var(--ball)"><div class="row"><h3 class="grow" style="margin:0">🚗 La tua auto</h3>
      <span class="badge ${used > tot ? 'err' : used === tot ? 'warn' : 'ok'}">${used}/${tot} posti occupati</span></div>
    <p class="muted small" style="margin:6px 0 0">Indica chi viaggia con te: si aggiorna anche nella loro scheda.</p>
    ${pas.map(x => `<div class="member"><span class="nm">${esc(x.name)}${x.plus_one ? ` <span class="muted small">+ ${esc(x.plus_one_name || '1')}</span>` : ''}</span>
      <button class="btn sm ghost" onclick="removePassenger('${x.participant_id}')">✕</button></div>`).join('')}
    ${others.map((o, i) => `<div class="member"><span class="nm">${esc(o)} <span class="muted small">(non in app)</span></span>
      <button class="btn sm ghost" onclick="removeOther(${i})">✕</button></div>`).join('')}
    ${used < tot ? `<label class="f">Aggiungi un invitato</label>
      <div class="row"><select id="add-pas" class="grow" style="flex:1"><option value="">— scegli —</option>${cand}</select>
      <button class="btn sm gold" onclick="addPassenger()">Aggiungi</button></div>
      <label class="f">…o una persona che non usa l'app</label>
      <div class="row"><input data-draft="add-other" id="add-other" class="grow" style="flex:1" placeholder="Nome e cognome">
      <button class="btn sm" onclick="addOther()">Aggiungi</button></div>`
      : `<p class="small" style="margin:10px 0 0">Auto piena. Per aggiungere qualcuno aumenta i posti da <a href="#" onclick="event.preventDefault();S.editIntol=true;S.det=null;render()">Auto, +1 e intolleranze</a>.</p>`}
    <div class="row" style="margin-top:12px"><button class="btn sm ghost" onclick="S.editIntol=true;S.det=null;render()">✏️ Cambia posti o auto</button></div></div>`;
}
async function setPassengers(ids, others, okMsg) {
  const { error } = await sb.rpc('set_passengers', { p_ids: ids, p_others: others });
  if (error) return toast(errMsg(error), 'err');
  toast(okMsg, 'ok'); await reload();
}
function myCarRow() { return S.me && S.carpool.find(c => c.participant_id === S.me.id && c.car === 'si'); }
async function addPassenger() {
  const mine = myCarRow(), id = $('#add-pas').value; if (!mine || !id) return toast('Scegli un invitato');
  const c = S.carpool.find(x => x.participant_id === id), p = partById(id);
  if (c && c.car === 'si' && !confirm(`${p.name} ha indicato di avere l'auto: aggiungendolo alla tua, la sua auto verrà tolta. Continuare?`)) return;
  if (c && c.ride_with && c.ride_with !== mine.participant_id && !confirm(`${p.name} risulta in auto con ${partById(c.ride_with)?.name || '?'}. Spostarlo nella tua?`)) return;
  const ids = S.carpool.filter(x => x.ride_with === mine.participant_id).map(x => x.participant_id).concat(id);
  await setPassengers(ids, mine.car_others || [], `${p.name.split(' ')[0]} è in auto con te 🚗`);
}
async function removePassenger(id) {
  const mine = myCarRow(); if (!mine) return;
  if (!confirm(`Togliere ${partById(id)?.name} dalla tua auto?`)) return;
  const ids = S.carpool.filter(x => x.ride_with === mine.participant_id && x.participant_id !== id).map(x => x.participant_id);
  await setPassengers(ids, mine.car_others || [], 'Aggiornato');
}
async function addOther() {
  const mine = myCarRow(), name = ($('#add-other').value || '').trim(); if (!mine || !name) return toast('Scrivi un nome');
  clearDrafts('add-other');
  const ids = S.carpool.filter(x => x.ride_with === mine.participant_id).map(x => x.participant_id);
  await setPassengers(ids, [...(mine.car_others || []), name], 'Aggiunto');
}
async function removeOther(i) {
  const mine = myCarRow(); if (!mine) return;
  const ids = S.carpool.filter(x => x.ride_with === mine.participant_id).map(x => x.participant_id);
  await setPassengers(ids, (mine.car_others || []).filter((_, k) => k !== i), 'Aggiornato');
}
function viewRides() {
  const cp = S.carpool;
  const drivers = cp.filter(c => c.car === 'si');
  const looking = cp.filter(c => c.car === 'no' && !c.ride_with);
  const unknown = cp.filter(c => !c.car);
  const mine = S.me && cp.find(c => c.participant_id === S.me.id);
  const plus = c => c.plus_one ? ' <span class="muted small">+1</span>' : '';
  const onBoard = cp.filter(c => c.car === 'si' || c.ride_with).reduce((n, c) => n + 1 + (c.plus_one ? 1 : 0), 0)
    + drivers.reduce((n, c) => n + (c.car_others || []).length, 0);
  const people = cp.reduce((n, c) => n + 1 + (c.plus_one ? 1 : 0), 0);
  return `<h2>🚗 Passaggi</h2>
    ${mine && mine.car === 'si' ? myCarEditor(mine) : mine ? `<div class="card"><div class="row"><div class="grow">${
        mine.car === 'no' ? (mine.ride_with ? `Vai con <b>${esc(partById(mine.ride_with)?.name || '?')}</b>` : 'Cerchi ancora un passaggio')
        : 'Non hai ancora indicato come arrivi'}</div>
      <button class="btn sm gold" onclick="S.editIntol=true;S.det=null;render()">✏️ Aggiorna</button></div></div>` : ''}
    ${S.isAdmin ? `<div class="card small"><b>${onBoard}</b> persone già sistemate in ${drivers.length} auto su <b>${people}</b> (sì + forse, accompagnatori inclusi)</div>` : ''}
    <h3 style="margin:16px 0 8px">Auto (${drivers.length})</h3>
    ${drivers.map(c => {
      const free = freeSeats(c), used = usedSeats(c), cap = 1 + (c.plus_one ? 1 : 0) + (c.car_seats || 0);
      return `<div class="card"><div class="row"><b class="grow">🚗 Auto di ${esc(c.name)}</b>
          <span class="badge ${used > (c.car_seats || 0) ? 'err' : free ? 'ok' : 'warn'}">${free ? (free === 1 ? '1 posto libero' : `${free} posti liberi`) : used > (c.car_seats || 0) ? 'troppi' : 'piena'}</span></div>
        <div class="small muted" style="margin-top:2px">${cap - free}/${cap} a bordo</div>
        <ol style="margin:8px 0 0;padding-left:20px">${carCrew(c).map(x => `<li style="padding:2px 0">${x}</li>`).join('')}</ol></div>`;
    }).join('') || '<div class="card muted small">Nessuno ha ancora indicato un\'auto.</div>'}
    <div class="card"><h3>Cercano un passaggio (${looking.length})</h3>
      ${looking.map(c => `<div class="member"><span class="nm">${esc(c.name)}${plus(c)}</span></div>`).join('') || '<div class="muted small">Nessuno 👍</div>'}</div>
    ${unknown.length ? `<div class="card"><h3>Non hanno ancora indicato (${unknown.length})</h3><div class="small muted">${unknown.map(c => esc(c.name)).join(', ')}</div></div>` : ''}
    <p class="muted small center">Chi guida aggiunge i passeggeri qui sopra; chi non guida può indicare "vado con…" da ✏️ Aggiorna.</p>`;
}

/* ---------- app principale */
function header() {
  const team = S.me ? teamById(S.me.team_id) : null;
  const who = S.me ? `<span class="dot" style="background:${esc(team ? team.color : '#5d7596')}"></span>${esc(S.me.name)}${team ? ' · ' + esc(team.name) : ''}` : '👑 Admin';
  return `<header class="top"><div class="wrap"><div class="logo"><span>🎾</span> ${esc(S.settings.title)}</div>
    <button class="chip" onclick="openMenu()">${who} ▾</button></div></header>`;
}

function newsSeenKey() { return 'fanta-news-seen-' + (S.me ? S.me.id : 'admin'); }
function unreadNews() {
  const seen = lsGet(newsSeenKey()) || '';
  return S.news.filter(n => n.created_at > seen).length;
}
function markNewsSeen() {
  const last = S.news.reduce((m, n) => n.created_at > m ? n.created_at : m, '');
  if (last) lsSet(newsSeenKey(), last);
}

function viewMain() {
  const tabs = [['notizie', '📰', 'Notizie']];
  if (S.me && teamById(S.me.team_id)) tabs.push(['squadra', '🎯', 'Obiettivi']);
  tabs.push(['passaggi', '🚗', 'Passaggi']);
  tabs.push(['classifica', '🏆', 'Classifica']);
  if (S.isAdmin) tabs.push(['admin', '👑', 'Admin']);
  if (!tabs.find(t => t[0] === S.tab)) S.tab = tabs[0][0];
  if (S.tab === 'notizie') markNewsSeen();
  const unread = unreadNews();
  const content = S.tab === 'notizie' ? viewNews() : S.tab === 'squadra' ? viewTeam() : S.tab === 'passaggi' ? viewRides() : S.tab === 'classifica' ? viewBoard() : viewAdmin();
  return header() + `<main class="wrap">${content}</main>` +
    `<nav class="tabs">${tabs.map(([k, i, l]) => `<button class="${S.tab === k ? 'on' : ''}" onclick="setTab('${k}')"><span class="i">${i}</span>${l}${k === 'notizie' && unread ? `<span class="nb">${unread}</span>` : ''}</button>`).join('')}</nav>`;
}
function setTab(k) { S.tab = k; render(); window.scrollTo(0, 0); }

/* ---------- notizie */
function viewNews() {
  const composer = S.isAdmin ? newsComposer() : '';
  const list = S.news.map(n => {
    const isImg = n.file_path && (n.file_type || '').startsWith('image/');
    const att = !n.file_path ? '' : isImg
      ? `<img class="att" data-bucket="${NEWS_BUCKET}" data-path="${esc(n.file_path)}" alt="" onclick="openNewsFile('${n.id}')">`
      : `<button class="btn sm" style="margin-top:10px" onclick="openNewsFile('${n.id}')">📄 Apri allegato</button>`;
    return `<article class="card news ${n.pinned ? 'pinned' : ''}">
      <div class="row"><h3 class="grow" style="margin:0">${n.pinned ? '📌 ' : ''}${esc(n.title)}</h3><span class="muted small">${fmtDate(n.created_at)}</span></div>
      ${n.body ? `<div class="body">${linkify(n.body)}</div>` : ''}${att}
      ${S.isAdmin ? `<div class="row" style="margin-top:10px">
        <button class="btn sm" onclick="editNews('${n.id}')">✏️ Modifica</button>
        <button class="btn sm" onclick="run(sb.from('news').update({pinned:${!n.pinned}}).eq('id','${n.id}'))">${n.pinned ? 'Sblocca' : '📌 Fissa in alto'}</button>
        <button class="btn sm danger" onclick="deleteNews('${n.id}')">🗑</button></div>` : ''}
    </article>`;
  }).join('');
  return inviteHtml(true) + composer + (list || `<div class="card empty">Ancora nessuna notizia.<br>Menu, programma e novità arriveranno qui. 🎾</div>`);
}
function newsComposer() {
  const ed = S.editingNews ? S.news.find(n => n.id === S.editingNews) : null;
  const curFile = ed && ed.file_path && !S.newsRemoveFile;
  return `<div class="card" id="newsForm"><h3>${ed ? '✏️ Modifica notizia' : '📣 Nuova notizia'}</h3>
    <input data-draft="n-title" id="n-title" placeholder="Titolo (es. Il menu)">
    <textarea data-draft="n-body" id="n-body" placeholder="Testo" style="margin-top:8px;min-height:90px"></textarea>
    ${curFile ? `<div class="row small" style="margin-top:8px"><span class="muted grow">📎 Allegato presente</span><button class="btn sm ghost" onclick="S.newsRemoveFile=true;render()">Rimuovi</button></div>` : ''}
    <label class="btn sm" style="margin-top:8px">📎 ${S.newsFile ? esc(S.newsFile.name) : (curFile ? 'Sostituisci allegato' : 'Allega foto o PDF')}
      <input type="file" accept="image/*,application/pdf" hidden onchange="S.newsFile=this.files[0]||null;render()"></label>
    ${S.newsFile ? `<button class="btn sm ghost" onclick="S.newsFile=null;render()">✕</button>` : ''}
    <label class="row small" style="margin-top:10px"><input type="checkbox" data-draft="n-pin" id="n-pin"> Fissa in alto</label>
    <div class="row" style="margin-top:12px"><button class="btn primary grow" onclick="saveNews()">${ed ? 'Salva' : 'Pubblica'}</button>
    ${ed ? `<button class="btn" onclick="cancelNews()">Annulla</button>` : ''}</div></div>`;
}
function editNews(id) {
  const n = S.news.find(x => x.id === id); S.editingNews = id; S.newsFile = null; S.newsRemoveFile = false;
  Object.assign(S.drafts, { 'n-title': n.title, 'n-body': n.body || '', 'n-pin': n.pinned });
  render(); $('#newsForm').scrollIntoView({ behavior: 'smooth' });
}
function cancelNews() { S.editingNews = null; S.newsFile = null; S.newsRemoveFile = false; clearDrafts('n-title', 'n-body', 'n-pin'); render(); }
async function saveNews() {
  const title = $('#n-title').value.trim(); if (!title) return toast('Serve un titolo');
  const ed = S.editingNews ? S.news.find(n => n.id === S.editingNews) : null;
  const row = { title, body: $('#n-body').value.trim() || null, pinned: $('#n-pin').checked };
  S.busy = true;
  try {
    const oldPath = ed && ed.file_path;

async function hydrateThumbs() {
  const els = [...document.querySelectorAll('img[data-path]')];
  if (!els.length) return;
  const now = Date.now();
  const key = e => (e.dataset.bucket || BUCKET) + ':' + e.dataset.path;
  const byBucket = {};
  els.forEach(e => {
    const k = key(e); if (S.urlCache[k] && S.urlCache[k].exp > now) return;
    const b = e.dataset.bucket || BUCKET; (byBucket[b] = byBucket[b] || new Set()).add(e.dataset.path);
  });
  await Promise.all(Object.entries(byBucket).map(async ([b, set]) => {
    const { data } = await sb.storage.from(b).createSignedUrls([...set], 3600);
    (data || []).forEach(d => { if (d.signedUrl && d.path) S.urlCache[b + ':' + d.path] = { url: d.signedUrl, exp: now + 3300e3 }; });
  }));
  els.forEach(e => { const c = S.urlCache[key(e)]; if (c && e.src !== c.url) e.src = c.url; });
}

/* ---------------------------------------------------------- caricamento prova */
function extOf(file) {
  const m = (file.name || '').match(/\.([a-z0-9]{2,5})$/i);
  if (m) return m[1].toLowerCase();
  const t = (file.type || '').split('/')[1] || 'bin';
  return t.replace('quicktime', 'mov').replace('jpeg', 'jpg').replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
}

function waitEvent(el, ev, ms) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('timeout')), ms);
    el.addEventListener(ev, () => { clearTimeout(t); res(); }, { once: true });
    el.addEventListener('error', () => { clearTimeout(t); rej(new Error('media error')); }, { once: true });
  });
}

async function makeThumb(file) {
  const MAX = 480; let url;
  try {
    url = URL.createObjectURL(file);
    let src, w, h;
    if ((file.type || '').startsWith('image/')) {
      const img = new Image(); img.src = url; await waitEvent(img, 'load', 15000);
      src = img; w = img.naturalWidth; h = img.naturalHeight;
    } else if ((file.type || '').startsWith('video/') || /\.(mov|mp4|m4v)$/i.test(file.name)) {
      const v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url; v.load();
      await waitEvent(v, 'loadeddata', 8000);
      v.currentTime = Math.min(0.5, (v.duration || 1) / 2);
      await waitEvent(v, 'seeked', 5000);
      src = v; w = v.videoWidth; h = v.videoHeight;
    } else return null;
    if (!w || !h) return null;
    const k = Math.min(1, MAX / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.75));
  } catch (e) { return null; }
  finally { if (url) URL.revokeObjectURL(url); }
}

async function xhrUpload(path, file, onProgress) {
  const { data: { session } } = await sb.auth.getSession();
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path.split('/').map(encodeURIComponent).join('/')}`);
    xhr.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) return resolve();
      let m = 'HTTP ' + xhr.status;
      try { const j = JSON.parse(xhr.responseText); m = j.message || j.error || m; } catch (e) { }
      if (xhr.status === 413 || /size/i.test(m)) m = 'file troppo grande (max 50 MB)';
      reject(new Error(m));
    };
    xhr.onerror = () => reject(new Error('errore di rete durante il caricamento'));
    const fd = new FormData();
    fd.append('cacheControl', '3600');
    fd.append('', file);
    xhr.send(fd);
  });
}

async function uploadProof(oid, input) {
  const file = input.files && input.files[0]; input.value = '';
  if (!file || !S.me) return;
  const tid = S.me.team_id, o = objById(oid);
  if (!tid || !o) return toast('Obiettivo non disponibile', 'err');
  if (file.size > MAX_BYTES) return alert(`Il file pesa ${fmtSize(file.size)}, il limite è 50 MB.\nPer i video: clip più corta o registrata in 1080p invece che 4K.`);
  if (S.submissions.some(s => s.objective_id === oid && s.team_id === tid && !s.revoked)) return toast('La tua squadra ha già completato questo obiettivo');
  S.busy = true;
  const id = uuid(), path = `${tid}/${id}.${extOf(file)}`;
  try {
    showProgress('Preparazione…', 0);
    const thumb = await makeThumb(file);
    await xhrUpload(path, file, p => showProgress(`Caricamento… ${Math.round(p * 100)}%`, p));
    showProgress('Quasi fatto…', 1);
    let thumbPath = null;
    if (thumb) {
      thumbPath = `${tid}/t_${id}.jpg`;
      const r = await sb.storage.from(BUCKET).upload(thumbPath, thumb, { contentType: 'image/jpeg' });
      if (r.error) thumbPath = null;
    }
    const { error } = await sb.rpc('submit_proof', { p_objective: oid, p_path: path, p_thumb: thumbPath, p_type: file.type || '', p_size: file.size, p_name: file.name || '' });
    if (error) throw error;
    S.busy = false; closeModal();
    toast(`Prova caricata! +${o.points} punti 🎉`, 'ok');
  } catch (e) {
    S.busy = false; closeModal();
    alert('Caricamento non riuscito: ' + errMsg(e));
  }
  await reload();
}

    return `🚗 ha l'auto · ${c ? usedSeats(c) : 0}/${g.car_seats ?? 0} posti occupati${(g.car_others || []).length ? ' · con ' + esc(g.car_others.join(', ')) : ''}`; }
  if (g.car === 'no') return g.ride_with ? `🙋 va con ${esc(partById(g.ride_with)?.name || '?')}` : '🙋 cerca un passaggio';
  return '';
}
function exportGuests() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lab = { si: 'Sì', forse: 'Forse', no: 'No', '': 'Nessuna risposta' };
  const lines = [['Nome', 'Risposta', 'Squadra', 'Intolleranze', 'Note', 'Accompagnatore', 'Intolleranze accompagnatore', 'Auto', 'Posti liberi', 'Va con', 'Aggiornato'].map(q).join(';')];
  guestRows().sort((a, b) => a.p.name.localeCompare(b.p.name)).forEach(x => lines.push([
    x.p.name, lab[x.r], teamById(x.p.team_id)?.name || '', (x.g && x.g.diet_tags || []).join(', '), x.g && x.g.intolerances || '',
    x.g && x.g.plus_one ? x.g.plus_one_name : '', x.g && x.g.plus_one ? x.g.plus_one_notes || '' : '',
    x.g ? ({ si: 'Sì', no: 'No' }[x.g.car] || '') : '', x.g && x.g.car === 'si' ? x.g.car_seats : '', x.g && x.g.ride_with ? partById(x.g.ride_with)?.name || '' : '',
    x.g ? new Date(x.g.updated_at).toLocaleString('it-IT') : ''].map(q).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'invitati.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

function randomColor() { const c = ['#DCF03A', '#2F6FC0', '#FF6B81', '#39D0B3', '#FFC857', '#9B6BFF', '#FF8C42', '#E8F1FF']; return c[S.teams.length % c.length]; }
async function drawTeams() {
  const cand = looseParticipants().filter(p => ['si', 'forse'].includes(guestOf(p.id)?.rsvp));
  if (!cand.length || !S.teams.length) return;
  if (!confirm(`Distribuire a caso ${cand.length} persone (Sì e Forse senza squadra) tra le ${S.teams.length} squadre, bilanciando i numeri?`)) return;
  for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
  const size = {}; S.teams.forEach(t => size[t.id] = S.participants.filter(p => p.team_id === t.id).length);
  const moves = cand.map(p => {
    const min = Math.min(...Object.values(size));
    const opts = S.teams.filter(t => size[t.id] === min);
    const t = opts[Math.floor(Math.random() * opts.length)];
    size[t.id]++;
    return sb.from('participants').update({ team_id: t.id }).eq('id', p.id);
  });
  const res = await Promise.all(moves);
  const bad = res.find(r => r.error);
  toast(bad ? errMsg(bad.error) : 'Squadre sorteggiate 🎲', bad ? 'err' : 'ok');
  await reload();
}
async function addTeam() {

  clearDrafts('t-name', 't-color');
  await run(sb.from('teams').insert({ name, color: $('#t-color').value }), 'Squadra creata');
}
async function renameTeam(id) {

  if (n && n.trim()) await run(sb.from('teams').update({ name: n.trim() }).eq('id', id));

async function deleteTeam(id) {
  const t = teamById(id);
  if (!confirm(`Eliminare la squadra «${t.name}»?\nI membri restano senza squadra; prove, file e bonus di questa squadra vengono cancellati.`)) return;
  try { await removePaths(BUCKET, await listFolder(BUCKET, id)); } catch (e) { }
  await run(sb.from('teams').delete().eq('id', id), 'Squadra eliminata');
}
async function addParticipants(tid) {
  const key = 'p-new-' + (tid || 'none');
  const names = ($('#' + key).value || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (!names.length) return toast('Scrivi almeno un nome');
  const existing = new Set(S.participants.map(p => normName(p.name)));
  const dup = names.filter(n => existing.has(normName(n)));
  if (dup.length && !confirm(`Esistono già: ${dup.join(', ')}.\nAggiungerli comunque?`)) return;
  clearDrafts(key);
  await run(sb.from('participants').insert(names.map(name => ({ name, team_id: tid || null }))), `${names.length} aggiunti`);
}
async function moveParticipant(pid, tid) { await run(sb.from('participants').update({ team_id: tid || null }).eq('id', pid), 'Spostato'); }
async function renameParticipant(pid) {
  const p = partById(pid); const n = prompt('Nuovo nome', p.name);

async function disconnectDevices(pid) {

async function deleteParticipant(pid) {

function editObjective(id) {
  const o = objById(id); S.editingObj = id;
  Object.assign(S.drafts, { 'o-title': o.title, 'o-desc': o.description || '', 'o-points': String(o.points), 'o-team': o.team_id || '', 'o-active': o.active });
  render(); $('#objForm').scrollIntoView({ behavior: 'smooth' });
}
function cancelEditObj() { S.editingObj = null; clearDrafts('o-title', 'o-desc', 'o-points', 'o-team', 'o-active'); render(); }
async function saveObjective() {
  const title = $('#o-title').value.trim(); if (!title) return toast('Serve un titolo');
  const points = parseInt($('#o-points').value, 10); if (isNaN(points)) return toast('Punti non validi');
  const row = { title, description: $('#o-desc').value.trim() || null, points, team_id: $('#o-team').value || null, active: $('#o-active').checked };
  let ok;
  if (S.editingObj) ok = await run(sb.from('objectives').update(row).eq('id', S.editingObj), 'Obiettivo aggiornato');
  else ok = await run(sb.from('objectives').insert({ ...row, sort: S.objectives.reduce((m, o) => Math.max(m, o.sort), 0) + 1 }), 'Obiettivo creato');
  if (ok) { S.editingObj = null; clearDrafts('o-title', 'o-desc', 'o-points', 'o-team', 'o-active'); render(); }
}
async function moveObj(id, dir) {
  const list = [...S.objectives]; const i = list.findIndex(o => o.id === id); const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  await Promise.all(list.map((o, k) => o.sort !== k ? sb.from('objectives').update({ sort: k }).eq('id', o.id) : null));
  await reload();
}
async function deleteObjective(id) {
  const o = objById(id); const subs = S.submissions.filter(s => s.objective_id === id);
  if (!confirm(`Eliminare «${o.title}»?${subs.length ? `\nAttenzione: ${subs.length} prove collegate (e i relativi punti) verranno cancellate.` : ''}`)) return;
  try { await removePaths(BUCKET, subs.flatMap(s => [s.file_path, s.thumb_path]).filter(Boolean)); } catch (e) { }
  await run(sb.from('objectives').delete().eq('id', id), 'Obiettivo eliminato');
}

/* ---------- prove */
function filteredProofs() { return S.submissions.filter(s => !S.proofFilter || s.team_id === S.proofFilter); }
function adminProofs() {
  const list = filteredProofs();
  const avail = list.filter(s => !s.file_deleted);
  return `<div class="card"><div class="row"><select class="grow" style="flex:1" onchange="S.proofFilter=this.value;render()">
      <option value="">Tutte le squadre (${S.submissions.length})</option>${S.teams.map(t => `<option value="${t.id}" ${S.proofFilter === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
      <button class="btn gold" onclick="zipProofs()" ${avail.length ? '' : 'disabled'}>⬇︎ ZIP (${avail.length})</button></div>
      <p class="muted small" style="margin:8px 0 0">Gli originali sono scaricati senza ricompressione. ZIP: ${fmtSize(avail.reduce((a, s) => a + (s.file_size || 0), 0))}</p></div>
    ${list.map(s => {
      const o = objById(s.objective_id), t = teamById(s.team_id), p = partById(s.participant_id);
      return `<div class="card obj" style="${s.revoked ? 'opacity:.6' : ''}">${thumbHtml(s)}<div class="body">
        <div class="row"><b class="grow">${esc(o ? o.title : '?')}</b><span class="pts">${s.revoked ? '0' : '+' + s.points}</span></div>
        <div class="small muted"><span class="dot" style="background:${esc(t ? t.color : '#777')}"></span> ${esc(t ? t.name : '?')} · ${esc(p ? p.name : '?')} · ${fmtDate(s.created_at)} · ${fmtSize(s.file_size)}</div>
        <div style="margin-top:4px">${s.revoked ? '<span class="badge err">revocata</span> ' : ''}${s.file_deleted ? '<span class="badge hid">file eliminato</span>' : ''}</div>
        <div class="row" style="margin-top:8px">
          ${s.file_deleted ? '' : `<button class="btn sm gold" onclick="downloadOriginal('${s.id}')">⬇︎ Originale</button>`}
          <button class="btn sm" onclick="toggleRevoke('${s.id}')">${s.revoked ? '↩︎ Ripristina' : '⛔ Revoca'}</button>
          ${s.file_deleted ? '' : `<button class="btn sm ghost" onclick="deleteFile('${s.id}')" title="Elimina file per liberare spazio">🗑 File</button>`}</div></div></div>`;
    }).join('') || '<div class="card empty">Nessuna prova caricata.</div>'}`;
}
function niceName(s) {
  const o = objById(s.objective_id), t = teamById(s.team_id), p = partById(s.participant_id);
  const d = new Date(s.created_at); const pad = n => String(n).padStart(2, '0');
  const ts = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  const ext = (s.file_path.match(/\.([a-z0-9]+)$/i) || [, 'bin'])[1];
  return `${slug(t && t.name)}_${slug(o && o.title)}_${slug(p && p.name)}_${ts}.${ext}`;
}
async function downloadOriginal(id) {
  const s = S.submissions.find(x => x.id === id); if (!s) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(s.file_path, 600, { download: niceName(s) });
  if (error) return toast(errMsg(error), 'err');
  const a = document.createElement('a'); a.href = data.signedUrl; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
async function toggleRevoke(id) {
  const s = S.submissions.find(x => x.id === id);
  if (!s.revoked && !confirm('Revocare questa prova? La squadra perde i punti e potrà ricaricarne un\'altra.')) return;
  const ok = await run(sb.from('submissions').update({ revoked: !s.revoked }).eq('id', id), s.revoked ? 'Prova ripristinata' : 'Prova revocata');
  if (!ok && s.revoked) toast('Non ripristinabile: la squadra ha già caricato una nuova prova per questo obiettivo', 'err');
}
async function deleteFile(id) {
  const s = S.submissions.find(x => x.id === id);
  if (!confirm('Hai già scaricato l\'originale?\nIl file viene eliminato per liberare spazio; i punti restano.')) return;
  const { error } = await sb.storage.from(BUCKET).remove([s.file_path, s.thumb_path].filter(Boolean));
  if (error) return toast(errMsg(error), 'err');
  await run(sb.from('submissions').update({ file_deleted: true }).eq('id', id), 'File eliminato');
}
async function zipProofs() {
  const list = filteredProofs().filter(s => !s.file_deleted);
  const total = list.reduce((a, s) => a + (s.file_size || 0), 0);
  if (total > 400 * 1048576 && !confirm(`Lo ZIP pesa circa ${fmtSize(total)}. Su telefono potrebbe non farcela: meglio da computer. Continuare?`)) return;
  S.busy = true;
  const zip = new JSZip(); let done = 0, failed = 0;
  try {
    for (const s of list) {
      showProgress(`Scarico ${done + 1}/${list.length}…`, done / list.length);
      const { data, error } = await sb.storage.from(BUCKET).download(s.file_path);
      if (error || !data) failed++;
      else zip.file(`${slug(teamById(s.team_id)?.name)}/${niceName(s)}`, data, { binary: true });
      done++;
    }
    showProgress('Creo lo ZIP…', 1);
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    const team = S.proofFilter ? slug(teamById(S.proofFilter)?.name) : 'tutte';
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `prove_${team}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    S.busy = false; closeModal();
    toast(failed ? `ZIP pronto, ${failed} file non scaricati` : 'ZIP pronto ✅', failed ? 'err' : 'ok');
  } catch (e) { S.busy = false; closeModal(); alert('Errore ZIP: ' + errMsg(e)); }
}

  await run(sb.from('adjustments').insert({ team_id, points, reason: $('#a-reason').value.trim() || null }), 'Applicato');
}
async function delAdjustment(id) { if (confirm('Eliminare questo bonus/malus?')) await run(sb.from('adjustments').delete().eq('id', id)); }

/* ---------- impostazioni e reset */
function adminSettings() {
  const st = S.settings;
  const used = S.submissions.filter(s => !s.file_deleted).reduce((a, s) => a + (s.file_size || 0), 0);
  const pct = Math.min(100, used / STORAGE_QUOTA * 100);
  return `<div class="card"><h3>🎾 Invito</h3>
      <div class="row"><div class="grow" style="min-width:140px"><label class="f">Festeggiato</label><input data-draft="s-iname" id="s-iname" value="${esc(st.invite_name || '')}"></div>
      <div style="width:90px"><label class="f">Anni</label><input data-draft="s-iage" id="s-iage" type="number" inputmode="numeric" value="${esc(st.invite_age ?? 30)}"></div></div>
      <label class="f">Data della festa</label><input data-draft="s-idate" id="s-idate" type="date" value="${esc(st.invite_date || '')}">
      <label class="f">Dettagli (luogo, orario, dress code…)</label><textarea data-draft="s-idet" id="s-idet" placeholder="Es. Ore 20:30 · Circolo …">${esc(st.invite_details || '')}</textarea>
      <button class="btn primary block" style="margin-top:10px" onclick="saveInvite()">Salva invito</button>
      <button class="btn ghost block" style="margin-top:8px" onclick="previewInvite()">👁 Anteprima</button>
      <button class="btn ghost block" style="margin-top:8px" onclick="showEnvelope()">✉️ Rivedi l'apertura della busta</button></div>
    <div class="card"><h3>Nome dell'app</h3><div class="row">
      <input class="grow" style="flex:1" data-draft="s-title" id="s-title" value="${esc(st.title)}">
      <button class="btn" onclick="saveTitle()">Salva</button></div></div>
    <div class="card"><h3>Spazio file</h3><div class="bar"><i style="width:${pct}%"></i></div>
      <p class="small muted">${fmtSize(used)} di prove su 1 GB (${pct.toFixed(0)}%). Per liberare spazio: scarica gli originali e usa "🗑 File" nelle Prove.</p></div>
    <div class="card"><h3>Cambia PIN admin</h3>
      <input id="pin1" type="password" inputmode="numeric" placeholder="Nuovo PIN (min 4)">
      <input id="pin2" type="password" inputmode="numeric" placeholder="Ripeti PIN" style="margin-top:8px">
      <button class="btn block" style="margin-top:8px" onclick="changePin()">Cambia PIN</button></div>
    <div class="card" style="border-color:var(--err)"><h3>⚠️ Reset</h3>
      <p class="small muted"><b>Azzera partita</b>: cancella prove, file e bonus. Restano invitati, risposte, squadre, obiettivi e notizie (ideale dopo le prove generali).</p>
      <button class="btn danger block" onclick="doReset(false)">Azzera partita</button>
      <p class="small muted" style="margin-top:14px"><b>Reset totale</b>: cancella anche invitati e risposte, squadre, obiettivi, notizie e scollega tutti i telefoni.</p>
      <button class="btn danger block" onclick="doReset(true)">Reset totale</button></div>
    <button class="btn ghost block" onclick="adminLogout()">Esci dalla modalità admin su questo dispositivo</button>`;
}
async function saveInvite() {
  const age = parseInt($('#s-iage').value, 10);
  const row = { invite_name: $('#s-iname').value.trim() || 'Vincenzo', invite_age: isNaN(age) ? 30 : age,
    invite_date: $('#s-idate').value || '2026-12-12', invite_details: $('#s-idet').value.trim() || null };
  clearDrafts('s-iname', 's-iage', 's-idate', 's-idet');
  await run(sb.from('settings').update(row).eq('id', 1), 'Invito salvato');
}
function previewInvite() {
  showModal(inviteHtml(false) + `<button class="btn block" onclick="closeModal()">Chiudi</button>`);
}
async function saveTitle() {
  const title = $('#s-title').value.trim(); if (!title) return;
  clearDrafts('s-title');
  await run(sb.from('settings').update({ title }).eq('id', 1), 'Salvato');
}
async function changePin() {
  const a = $('#pin1').value, b = $('#pin2').value;
  if (a.length < 4) return toast('Almeno 4 caratteri', 'err'); if (a !== b) return toast('I PIN non coincidono', 'err');
  const { error } = await sb.rpc('admin_set_pin', { p_new: a });
  if (error) return toast(errMsg(error), 'err');
  $('#pin1').value = $('#pin2').value = ''; toast('PIN cambiato ✅', 'ok');
}
async function listFolder(bucket, folder) {
  const out = []; let offset = 0;
  while (true) {
    const { data, error } = await sb.storage.from(bucket).list(folder, { limit: 1000, offset });
    if (error) throw error;
    (data || []).forEach(x => { if (x.id) out.push(folder ? `${folder}/${x.name}` : x.name); });
    if (!data || data.length < 1000) break; offset += 1000;
  }
  return out;
}
async function listAllFiles(bucket) {
  const { data, error } = await sb.storage.from(bucket).list('', { limit: 1000 });
  if (error) throw error;
  const out = [];
  for (const f of data || []) { if (f.id) out.push(f.name); else out.push(...await listFolder(bucket, f.name)); }
  return out;
}
async function removePaths(bucket, paths) {
  for (let i = 0; i < paths.length; i += 100) {
    const { error } = await sb.storage.from(bucket).remove(paths.slice(i, i + 100));
    if (error) throw error;
  }
}
async function doReset(full) {
  const word = full ? 'RESET TOTALE' : 'AZZERA';
  const ans = prompt(`${full ? 'Cancella TUTTO: invitati, risposte, squadre, obiettivi, notizie, prove, file.' : 'Cancella tutte le prove, i file e i bonus.'}\nOperazione irreversibile. Scrivi ${word} per confermare:`);
  if ((ans || '').trim().toUpperCase() !== word) return toast('Reset annullato');
  S.busy = true;
  try {
    showProgress('Elimino i file…', 0.2);
    await removePaths(BUCKET, await listAllFiles(BUCKET));
    if (full) await removePaths(NEWS_BUCKET, await listAllFiles(NEWS_BUCKET));
    showProgress('Azzero il database…', 0.8);
    const { error } = await sb.rpc('admin_reset', { p_full: full });
    if (error) throw error;
    S.busy = false; closeModal(); S.urlCache = {};
    toast('Reset completato', 'ok');
  } catch (e) { S.busy = false; closeModal(); alert('Reset non riuscito: ' + errMsg(e)); }
  await reload();
}
async function adminLogout() {
  if (!confirm('Uscire dalla modalità admin su questo dispositivo? Potrai rientrare col PIN.')) return;
  await sb.rpc('admin_logout'); S.tab = 'notizie'; await reload();
}

init();
</script>
</body>
